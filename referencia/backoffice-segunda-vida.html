<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Backoffice — Loja Solidária Segunda Vida</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#002C77;--navy-2:#0A3C94;--navy-3:#001A4A;
  --red:#E4002B;--red-dark:#B80022;--red-soft:#FDE8EC;
  --paper:#F6F1E8;--paper-2:#EFE7D8;
  --kraft:#C8A274;--kraft-dark:#A9834F;
  --ink:#121826;--muted:#5B6275;--line:rgba(18,24,38,.10);
  --green:#1E8E5A;--green-soft:#E3F4EA;--amber:#B86E00;--amber-soft:#FFF1D9;--blue-soft:#E6EDF8;
  --r:18px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--paper);color:var(--ink);font-size:14px;line-height:1.5}
h1,h2,h3,h4{font-family:"Space Grotesk",Inter,sans-serif;letter-spacing:-.02em;line-height:1.1}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{font:inherit;color:inherit}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}

/* ---------- Layout ---------- */
.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
.side{background:var(--navy);color:#fff;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:22px 16px;overflow:auto;z-index:40}
.brand{display:flex;align-items:center;gap:12px;padding:4px 8px 22px}
.brand .mark{width:42px;height:42px;border-radius:12px;background:var(--kraft);box-shadow:inset 0 -4px 0 var(--kraft-dark);display:grid;place-items:center;color:var(--ink)}
.brand b{font-family:"Space Grotesk";font-size:17px;display:block}
.brand small{opacity:.6;font-size:12px}
.nav-label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;opacity:.45;padding:16px 12px 8px}
.nav a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;color:rgba(255,255,255,.78);font-weight:500;cursor:pointer;position:relative;transition:background .15s,color .15s}
.nav a:hover{background:rgba(255,255,255,.07);color:#fff}
.nav a.on{background:#fff;color:var(--navy)}
.nav a.on::before{content:"";position:absolute;left:-16px;top:10px;bottom:10px;width:4px;border-radius:0 4px 4px 0;background:var(--red)}
.nav a .count{margin-left:auto;background:var(--red);color:#fff;font-size:11px;font-weight:700;border-radius:999px;padding:1px 8px}
.nav a.on .count{background:var(--red)}
.side-foot{margin-top:auto;padding-top:18px}
.partner-box{border:1px dashed rgba(255,255,255,.25);border-radius:14px;padding:12px;font-size:12px;opacity:.8;display:flex;gap:10px;align-items:center}
.partner-box .d{width:10px;height:10px;border-radius:50%;background:var(--red)}
.me{display:flex;align-items:center;gap:10px;padding:14px 8px 0}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--red);display:grid;place-items:center;font-weight:700;font-size:13px;color:#fff;flex:0 0 36px}
.me small{display:block;opacity:.6;font-size:12px}

main{min-width:0}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;padding:16px 32px;background:rgba(246,241,232,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.burger{display:none;width:40px;height:40px;border-radius:12px;background:#fff;border:1px solid var(--line);place-items:center}
.search{flex:1;max-width:460px;display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:0 14px;height:42px;color:var(--muted)}
.search input{border:0;outline:0;flex:1;background:none;height:100%}
.search kbd{font-size:11px;border:1px solid var(--line);border-radius:6px;padding:1px 6px;background:var(--paper)}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:10px}
.icon-btn{width:42px;height:42px;border-radius:12px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;position:relative;color:var(--navy)}
.icon-btn:hover{border-color:var(--navy)}
.icon-btn .dot{position:absolute;top:8px;right:9px;width:9px;height:9px;border-radius:50%;background:var(--red);border:2px solid #fff}
.view{padding:30px 32px 60px;max-width:1400px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:24px}
.page-head h1{font-size:32px;color:var(--navy)}
.page-head p{color:var(--muted);margin-top:6px}
.page-head .actions{display:flex;gap:10px;flex-wrap:wrap}

/* ---------- Buttons ---------- */
.btn{text-decoration:none;display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 18px;border-radius:12px;font-weight:600;white-space:nowrap;transition:transform .12s,box-shadow .15s,background .15s}
.btn-red{background:var(--red);color:#fff;box-shadow:0 4px 0 var(--red-dark)}
.btn-red:hover{transform:translateY(-1px);box-shadow:0 5px 0 var(--red-dark)}
.btn-red:active{transform:translateY(3px);box-shadow:0 1px 0 var(--red-dark)}
.btn-navy{background:var(--navy);color:#fff;box-shadow:0 4px 0 var(--navy-3)}
.btn-navy:active{transform:translateY(3px);box-shadow:0 1px 0 var(--navy-3)}
.btn-line{background:#fff;border:1.5px solid var(--line)}
.btn-line:hover{border-color:var(--navy);color:var(--navy)}
.btn-ghost{color:var(--muted)}.btn-ghost:hover{color:var(--ink);background:rgba(0,0,0,.04)}
.btn-danger{background:var(--red-soft);color:var(--red-dark)}
.btn-danger:hover{background:#FBD3DB}
.btn-sm{height:34px;padding:0 12px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}

/* ---------- Cards / KPIs ---------- */
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:22px}
.card h3{font-size:17px;color:var(--navy)}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px}
.card-head p{color:var(--muted);font-size:13px}
.grid{display:grid;gap:18px}
.kpis{grid-template-columns:repeat(4,1fr)}
.kpi{position:relative;overflow:hidden}
.kpi .lbl{color:var(--muted);font-size:13px;font-weight:500;display:flex;align-items:center;gap:8px}
.kpi .val{font-family:"Space Grotesk";font-size:32px;font-weight:700;margin-top:8px;color:var(--ink)}
.kpi .sub{font-size:12px;margin-top:4px;color:var(--muted)}
.kpi .sub b{color:var(--green)}
.kpi .ic{position:absolute;right:18px;top:18px;width:40px;height:40px;border-radius:12px;display:grid;place-items:center}
.kpi.k1 .ic{background:var(--blue-soft);color:var(--navy)}
.kpi.k2 .ic{background:var(--amber-soft);color:var(--amber)}
.kpi.k3 .ic{background:var(--green-soft);color:var(--green)}
.kpi.k4 .ic{background:var(--red-soft);color:var(--red)}
.two{grid-template-columns:1.6fr 1fr}

/* chart */
.chart{display:flex;align-items:flex-end;gap:8px;height:220px;padding-top:10px;border-bottom:1px solid var(--line);position:relative}
.bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;position:relative;cursor:pointer}
.bar i{display:block;width:100%;max-width:34px;background:var(--navy);border-radius:8px 8px 3px 3px;transition:height .6s cubic-bezier(.2,.9,.2,1),background .15s;min-height:3px}
.bar:hover i{background:var(--red)}
.bar.today i{background:var(--red)}
.bar .tip{position:absolute;bottom:calc(100% + 6px);left:50%;transform:translate(-50%,6px);background:var(--ink);color:#fff;font-size:12px;padding:6px 10px;border-radius:8px;white-space:nowrap;opacity:0;pointer-events:none;transition:all .15s;z-index:2}
.bar:hover .tip{opacity:1;transform:translate(-50%,0)}
.chart-x{display:flex;gap:8px;margin-top:8px}
.chart-x span{flex:1;text-align:center;font-size:11px;color:var(--muted)}
.hbar{display:grid;grid-template-columns:140px 1fr 70px;align-items:center;gap:12px;margin-bottom:12px;font-size:13px}
.hbar .t{height:12px;border-radius:6px;background:var(--paper-2);overflow:hidden}
.hbar .t i{display:block;height:100%;border-radius:6px;background:var(--navy);transition:width .6s}
.hbar b{text-align:right;font-family:"Space Grotesk"}

/* lists */
.alert-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px dashed var(--line)}
.alert-item:last-child{border:0}
.alert-item .ai{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:0 0 36px}
.alert-item .tx{flex:1;min-width:0}
.alert-item .tx b{display:block;font-weight:600}
.alert-item .tx span{color:var(--muted);font-size:12px}

/* ---------- Table ---------- */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.field-inline{display:flex;align-items:center;gap:8px;height:40px;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:0 12px;color:var(--muted)}
.field-inline input,.field-inline select{border:0;outline:0;background:none;height:100%;min-width:0;color:var(--ink)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.tab{height:36px;padding:0 14px;border-radius:999px;background:#fff;border:1.5px solid var(--line);font-weight:500;font-size:13px;display:inline-flex;align-items:center;gap:8px}
.tab.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.tab span{font-size:11px;font-weight:700;background:var(--paper-2);color:var(--ink);border-radius:999px;padding:0 7px}
.tab.on span{background:rgba(255,255,255,.2);color:#fff}
.table-wrap{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:auto}
table{width:100%;border-collapse:collapse;min-width:760px}
th{text-align:left;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding:14px 16px;background:#FBF9F5;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:14px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr{transition:background .12s}
tbody tr:hover{background:#FCFAF6}
tr.click{cursor:pointer}
.prod{display:flex;align-items:center;gap:12px}
.thumb{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:0 0 44px}
.thumb svg{width:26px;height:26px;stroke:var(--navy);stroke-width:2.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
.thumb.photo{overflow:hidden;background:var(--paper-2);position:relative;border:1px solid var(--line)}
.thumb.photo img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s}
.thumb.zoom{cursor:zoom-in}.thumb.zoom:hover img{transform:scale(1.08)}
.thumb .n{position:absolute;right:2px;bottom:2px;background:rgba(18,24,38,.8);color:#fff;font-size:10px;font-weight:700;border-radius:6px;padding:0 5px}
.thumb.nophoto{background:repeating-linear-gradient(45deg,#F3EEE4 0 6px,#EEE7DA 6px 12px);border:1.5px dashed #CFC4B0}
.prod b{display:block}
.no-photo-tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--amber);background:var(--amber-soft);padding:2px 8px;border-radius:999px;margin-top:3px}
/* galeria no modal */
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.ph-card{position:relative;aspect-ratio:4/3;border-radius:14px;overflow:hidden;background:var(--paper-2);border:1.5px solid var(--line);animation:fin .3s}
.ph-card img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.ph-card.cover{border-color:var(--red);box-shadow:0 0 0 3px var(--red-soft)}
.ph-card .cv{position:absolute;left:8px;top:8px;background:var(--red);color:#fff;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px}
.ph-card .tools{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:4px;padding:6px;background:linear-gradient(transparent,rgba(0,0,0,.55));opacity:0;transition:opacity .2s}
.ph-card:hover .tools,.ph-card:focus-within .tools{opacity:1}
.ph-card .tools button{width:30px;height:30px;border-radius:9px;background:rgba(255,255,255,.95);display:grid;place-items:center;color:var(--ink)}
.ph-card .tools button:hover{background:#fff;color:var(--navy)}
.ph-card .tools button.del:hover{color:var(--red)}
.ph-card .tools button:disabled{opacity:.4;cursor:not-allowed}
.drop{aspect-ratio:4/3;border-radius:14px;border:2px dashed #C9BEA9;background:#fff;display:grid;place-items:center;text-align:center;padding:10px;color:var(--muted);font-size:12px;cursor:pointer;transition:all .2s}
.drop b{display:block;color:var(--navy);font-size:13px;margin-top:6px}
.drop:hover,.drop.over{border-color:var(--navy);background:var(--blue-soft);color:var(--navy)}
.drop.over{transform:scale(1.02)}
@media (max-width:520px){.gallery{grid-template-columns:1fr 1fr}.ph-card .tools{opacity:1}}
/* lightbox */
.lb{position:fixed;inset:0;z-index:150;background:rgba(8,14,30,.88);display:grid;grid-template-rows:auto 1fr auto;opacity:0;transition:opacity .25s}
.lb.on{opacity:1}
.lb-top{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;color:#fff}
.lb-top b{font-family:"Space Grotesk";font-size:18px}
.lb-top span{opacity:.6;font-size:13px;margin-left:10px}
.lb-top button,.lb-nav{width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.12);color:#fff;display:grid;place-items:center}
.lb-top button:hover,.lb-nav:hover{background:rgba(255,255,255,.22)}
.lb-main{position:relative;display:grid;place-items:center;padding:0 70px;min-height:0}
.lb-main img{max-width:100%;max-height:100%;border-radius:16px;box-shadow:0 30px 80px -20px rgba(0,0,0,.6);animation:fin .25s}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%)}
.lb-nav.p{left:16px}.lb-nav.n{right:16px}
.lb-strip{display:flex;gap:8px;justify-content:center;padding:16px;overflow:auto}
.lb-strip img{width:64px;height:48px;object-fit:cover;border-radius:8px;opacity:.5;cursor:pointer;border:2px solid transparent}
.lb-strip img.on{opacity:1;border-color:#fff}
@media (max-width:520px){.lb-main{padding:0 12px}.lb-nav{display:none}}
.prod small{color:var(--muted);font-size:12px;font-family:ui-monospace,monospace}
.num{font-family:"Space Grotesk";font-weight:700}
.empty{padding:50px 20px;text-align:center;color:var(--muted)}

/* badges */
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.b-pend{background:var(--amber-soft);color:var(--amber)}
.b-pronta{background:var(--blue-soft);color:var(--navy)}
.b-entregue{background:var(--green-soft);color:var(--green)}
.b-cancel{background:#EEE;color:#6B6B6B}
.b-exp{background:var(--red-soft);color:var(--red-dark)}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:3px 9px;border-radius:8px;background:var(--paper-2)}
.pill.red{background:var(--red-soft);color:var(--red-dark)}

/* stepper + stock */
.stepper{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:10px;background:#fff;overflow:hidden}
.stepper button{width:30px;height:30px;font-size:16px;font-weight:700;color:var(--navy)}
.stepper button:hover{background:var(--paper-2)}
.stepper button:disabled{color:#CCC;background:none;cursor:not-allowed}
.stepper span{min-width:34px;text-align:center;font-family:"Space Grotesk";font-weight:700}
.stock-cell{display:flex;align-items:center;gap:10px}
.sbar{width:70px;height:6px;border-radius:3px;background:var(--paper-2);overflow:hidden}
.sbar i{display:block;height:100%;background:var(--navy)}
.low .sbar i{background:var(--red)}
.low .lbl{color:var(--red);font-weight:600}
.stock-cell .lbl{font-size:12px;color:var(--muted);min-width:64px}

/* toggle */
.toggle{position:relative;width:42px;height:24px;border-radius:12px;background:#D6D3CC;transition:background .2s;flex:0 0 42px}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s cubic-bezier(.3,1.5,.5,1);box-shadow:0 1px 3px rgba(0,0,0,.25)}
.toggle.on{background:var(--green)}
.toggle.on::after{transform:translateX(18px)}
.toggle:disabled{opacity:.6;cursor:not-allowed}

.row-actions{display:flex;gap:4px;justify-content:flex-end}
.row-actions button{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--muted)}
.row-actions button:hover{background:var(--paper-2);color:var(--navy)}
.row-actions button.del:hover{background:var(--red-soft);color:var(--red)}

/* ---------- Modal ---------- */
.overlay{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:20px;background:rgba(0,20,60,.42);backdrop-filter:blur(4px);opacity:0;transition:opacity .25s}
.overlay.on{opacity:1}
.modal{width:min(560px,100%);max-height:calc(100vh - 40px);display:flex;flex-direction:column;background:var(--paper);border-radius:24px;box-shadow:0 40px 90px -30px rgba(0,0,0,.55);transform:translateY(24px) scale(.96);transition:transform .35s cubic-bezier(.2,1.3,.4,1);overflow:hidden}
.overlay.on .modal{transform:none}
.modal.lg{width:min(820px,100%)}
.modal.xl{width:min(1040px,100%)}
.m-head{display:flex;align-items:flex-start;gap:14px;padding:22px 24px 18px;background:#fff;border-bottom:1px solid var(--line)}
.m-head .mi{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--blue-soft);color:var(--navy);flex:0 0 44px}
.m-head .mi.red{background:var(--red-soft);color:var(--red)}
.m-head .mi.green{background:var(--green-soft);color:var(--green)}
.m-head h3{font-size:20px;color:var(--navy)}
.m-head p{color:var(--muted);font-size:13px;margin-top:3px}
.m-head .x{margin-left:auto;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:var(--muted);flex:0 0 38px}
.m-head .x:hover{background:var(--paper-2);color:var(--ink)}
.m-body{padding:22px 24px;overflow:auto;flex:1}
.m-foot{display:flex;justify-content:flex-end;gap:10px;padding:16px 24px;background:#fff;border-top:1px solid var(--line);flex-wrap:wrap}
.m-foot .left{margin-right:auto}
.confirm .m-body{font-size:15px}

/* forms */
.form{display:grid;gap:16px}
.form .cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.form .cols3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
.f label,.f .l{display:block;font-weight:600;font-size:13px;margin-bottom:6px}
.f label small,.f .l small{font-weight:400;color:var(--muted)}
.f input:not([type=checkbox]):not([type=radio]),.f select,.f textarea{width:100%;height:44px;padding:0 14px;border-radius:12px;border:1.5px solid var(--line);background:#fff;outline:0;transition:border-color .15s,box-shadow .15s}
.f textarea{height:auto;padding:12px 14px;resize:vertical;min-height:120px;line-height:1.5}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--navy);box-shadow:0 0 0 4px rgba(0,44,119,.1)}
.f .hint{font-size:12px;color:var(--muted);margin-top:6px}
.f.err input,.f.err select,.f.err textarea{border-color:var(--red)}
.f.err .hint{color:var(--red)}
.input-suffix{position:relative}
.input-suffix span{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-weight:600;pointer-events:none}
.input-suffix button{position:absolute;right:6px;top:6px;height:32px;padding:0 10px;border-radius:8px;color:var(--navy);font-weight:600;font-size:12px}
.input-suffix button:hover{background:var(--paper-2)}
.icon-pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:8px}
.icon-pick button{aspect-ratio:1;border-radius:12px;background:#fff;border:1.5px solid var(--line);display:grid;place-items:center}
.icon-pick button svg{width:28px;height:28px;stroke:var(--navy);stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
.icon-pick button.on{border-color:var(--red);box-shadow:0 0 0 3px var(--red-soft)}
.switch-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 16px;background:#fff;border:1.5px solid var(--line);border-radius:14px}
.switch-row b{display:block;font-size:14px}
.switch-row span{font-size:12px;color:var(--muted)}
.seg{display:inline-flex;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{height:36px;padding:0 14px;border-radius:9px;font-weight:600;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--navy);color:#fff}
.meter{height:6px;border-radius:3px;background:var(--paper-2);margin-top:8px;overflow:hidden}
.meter i{display:block;height:100%;width:0;transition:width .3s,background .3s}

/* order detail */
.od-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:18px}
.info-box{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px}
.info-box h4{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-family:Inter;font-weight:600;margin-bottom:10px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0;font-size:14px}
.kv span{color:var(--muted)}
.note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:var(--blue-soft);color:var(--navy);font-size:13px}
.note.red{background:var(--red-soft);color:var(--red-dark)}
.note.amber{background:var(--amber-soft);color:var(--amber)}
.items-list .it{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px dashed var(--line)}
.items-list .it:last-child{border:0}
.items-list .it .t{flex:1}
.items-list .it small{color:var(--muted);display:block}
.tl{list-style:none;position:relative;margin-top:4px}
.tl::before{content:"";position:absolute;left:9px;top:6px;bottom:6px;width:2px;background:var(--paper-2)}
.tl li{position:relative;padding:0 0 14px 30px;font-size:13px}
.tl li::before{content:"";position:absolute;left:3px;top:4px;width:14px;height:14px;border-radius:50%;background:#fff;border:2px solid #CFC7B8}
.tl li.done::before{background:var(--navy);border-color:var(--navy)}
.tl li.now::before{background:var(--red);border-color:var(--red);box-shadow:0 0 0 4px var(--red-soft)}
.tl li b{display:block}
.tl li span{color:var(--muted);font-size:12px}
.pay-opts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pay-opts button{padding:16px 10px;border-radius:14px;background:#fff;border:1.5px solid var(--line);font-weight:600;display:grid;gap:6px;justify-items:center}
.pay-opts button.on{border-color:var(--navy);box-shadow:0 0 0 3px rgba(0,44,119,.12);color:var(--navy)}

/* email editor */
.email-layout{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.vars{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.vars button{font-family:ui-monospace,monospace;font-size:12px;padding:4px 8px;border-radius:8px;background:var(--blue-soft);color:var(--navy);font-weight:600}
.vars button:hover{background:var(--navy);color:#fff}
.mail{background:#fff;border-radius:16px;border:1px solid var(--line);overflow:hidden;font-size:14px}
.mail .mh{padding:12px 16px;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted);display:grid;gap:3px}
.mail .mh b{color:var(--ink)}
.mail .band{background:var(--navy);color:#fff;padding:18px 20px;display:flex;justify-content:space-between;align-items:center}
.mail .band span{font-family:"Space Grotesk";font-weight:700}
.mail .band small{border:1px dashed rgba(255,255,255,.5);border-radius:6px;padding:3px 8px;font-size:10px;letter-spacing:.06em}
.mail .mb{padding:20px;white-space:pre-wrap;line-height:1.6}
.mail .mf{padding:14px 20px;background:var(--paper);font-size:11px;color:var(--muted)}
.tpl-card{display:flex;gap:16px;align-items:center}
.tpl-card .ti{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;flex:0 0 48px}
.tpl-card .tx{flex:1;min-width:0}
.tpl-card .tx b{display:block;font-size:15px}
.tpl-card .tx span{color:var(--muted);font-size:13px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* settings */
.set-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.set-card .kv{border-bottom:1px dashed var(--line);padding:10px 0}
.set-card .kv:last-of-type{border:0}
.set-card .kv b{text-align:right}
.mono{font-family:ui-monospace,monospace}

/* popover */
.popover{position:fixed;z-index:90;width:360px;max-width:calc(100vw - 24px);background:#fff;border-radius:18px;border:1px solid var(--line);box-shadow:0 30px 60px -20px rgba(0,0,0,.3);opacity:0;transform:translateY(-8px) scale(.98);transform-origin:top right;transition:all .2s;pointer-events:none}
.popover.on{opacity:1;transform:none;pointer-events:auto}
.popover .ph{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.popover .ph b{font-family:"Space Grotesk";font-size:16px;color:var(--navy)}
.popover .pb{padding:4px 18px 10px;max-height:360px;overflow:auto}

/* toast */
.toasts{position:fixed;right:20px;bottom:20px;z-index:200;display:grid;gap:10px;justify-items:end}
.toast{display:flex;align-items:center;gap:12px;background:var(--ink);color:#fff;padding:12px 16px 12px 12px;border-radius:14px;box-shadow:0 20px 40px -20px rgba(0,0,0,.5);max-width:380px;animation:tin .35s cubic-bezier(.2,1.3,.4,1)}
.toast .ti{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:rgba(255,255,255,.12);flex:0 0 30px}
.toast.ok .ti{background:var(--green)}
.toast.err .ti{background:var(--red)}
.toast.mail .ti{background:var(--navy-2)}
.toast small{display:block;opacity:.65;font-size:12px}
.toast.out{animation:tout .3s forwards}
@keyframes tin{from{opacity:0;transform:translateY(16px) scale(.95)}}
@keyframes tout{to{opacity:0;transform:translateX(30px)}}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.fade-in{animation:fin .35s ease}
@keyframes fin{from{opacity:0;transform:translateY(8px)}}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}

/* ---------- Responsive ---------- */
@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,1fr)}.two,.set-grid,.email-layout,.od-grid{grid-template-columns:1fr}}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;width:270px;transform:translateX(-100%);transition:transform .3s cubic-bezier(.2,.9,.2,1);box-shadow:20px 0 60px -20px rgba(0,0,0,.4)}
  .side.open{transform:none}
  .burger{display:grid}
  .top{padding:12px 16px}
  .view{padding:22px 16px 60px}
  .search kbd{display:none}
  .page-head h1{font-size:26px}
  .form .cols,.form .cols3{grid-template-columns:1fr}
  .pay-opts{grid-template-columns:1fr}
  .hbar{grid-template-columns:100px 1fr 56px}
  .top-actions .btn span{display:none}
  .top-actions .btn{padding:0 12px}
}
@media (max-width:520px){.kpis{grid-template-columns:1fr}.search{display:none}.modal{border-radius:20px}.m-head,.m-body,.m-foot{padding-left:18px;padding-right:18px}}
@media (max-width:520px){
  .overlay{padding:0;place-items:end stretch}
  .modal,.modal.lg,.modal.xl{width:100%;max-height:92vh;border-radius:22px 22px 0 0;transform:translateY(40px)}
  .m-foot{gap:8px;padding-top:12px;padding-bottom:14px}
  .m-foot .btn{flex:1 1 auto;justify-content:center;height:40px;padding:0 12px}
  .m-foot .left{flex:1 1 100%;margin:0}.m-foot .left .btn{width:100%}
  .m-foot .btn-ghost{flex:0 0 auto}
  .m-head h3{font-size:18px}
  .toasts{left:12px;right:12px;bottom:12px;justify-items:stretch}.toast{max-width:none}
}
.side-scrim{display:none}
@media (max-width:860px){.side-scrim{display:block;position:fixed;inset:0;background:rgba(0,20,60,.35);z-index:35;opacity:0;pointer-events:none;transition:opacity .3s}.side-scrim.on{opacity:1;pointer-events:auto}}
</style>

const BG=[['#F4EFE6','#E2D6C2'],['#EEF2F8','#D3DDEE'],['#F6ECEC','#E7CFD1'],['#EDF3EE','#D1E2D5'],['#F5F0E4','#E4D5B5'],['#F0EEF6','#D9D4EA']];
function fakePhoto(key,v=0){
  const W=640,H=480,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
  const [a,b]=BG[(key.length+v*2)%BG.length];
  const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,a);g.addColorStop(.72,b);g.addColorStop(.72,'#CDBFA6');g.addColorStop(1,'#BFAF93');x.fillStyle=g;x.fillRect(0,0,W,H);
  const rg=x.createRadialGradient(W*.3,H*.2,10,W*.3,H*.2,W*.8);rg.addColorStop(0,'rgba(255,255,255,.55)');rg.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=rg;x.fillRect(0,0,W,H);
  x.fillStyle='rgba(40,25,5,.22)';x.beginPath();x.ellipse(W/2,H*.8,W*.26,H*.045,0,0,Math.PI*2);x.fill();
  const doc=new DOMParser().parseFromString(`<svg xmlns="http://www.w3.org/2000/svg">${PI[key]}</svg>`,'image/svg+xml');
  const path=new Path2D();
  doc.documentElement.querySelectorAll('*').forEach(el=>{const n=el.tagName,A=k=>+el.getAttribute(k)||0;
    if(n==='path')path.addPath(new Path2D(el.getAttribute('d')));
    else if(n==='rect'){path.rect(A('x'),A('y'),A('width'),A('height'));}
    else if(n==='circle'){path.moveTo(A('cx')+A('r'),A('cy'));path.arc(A('cx'),A('cy'),A('r'),0,Math.PI*2);}
    else if(n==='ellipse'){path.moveTo(A('cx')+A('rx'),A('cy'));path.ellipse(A('cx'),A('cy'),A('rx'),A('ry'),0,0,Math.PI*2);}});
  const sc=H*.62/64;x.save();x.translate(W/2,H*.44);if(v)x.scale(-1,1);x.rotate(v?.05:-.03);x.scale(sc,sc);x.translate(-32,-32);
  x.shadowColor='rgba(0,0,0,.25)';x.shadowBlur=18;x.shadowOffsetY=10;

}

let seed=7;const rnd=()=>{seed=(seed*9301+49297)%233280;return seed/233280;};

(function genOrders(){
  const states=['entregue','entregue','entregue','entregue','pronta','pendente','pendente','cancelada','entregue','pronta','pendente','entregue','entregue','pendente','expirada','entregue','entregue','pronta'];
  states.forEach((st,k)=>{
    const d=daysAgo(Math.floor(k*0.8)+ (st==='pendente'?0:1));d.setHours(9+Math.floor(rnd()*9),Math.floor(rnd()*59));
    const n=1+Math.floor(rnd()*2);const items=[];
    for(let j=0;j<n;j++){const p=pick(DB.products.filter(p=>p.id!==12));if(items.find(i=>i.pid===p.id))continue;items.push({pid:p.id,q:p.cat===5?1:1+Math.floor(rnd()*2),preco:p.preco});}
    const [nome,mail]=PEOPLE[k%PEOPLE.length];
    addOrder({nome,email:mail+'@fidelidade.pt',ncol:String(10230+k*37),tel:k%3?'91'+String(2345678+k*1111).slice(0,7):'',items,estado:st,data:d,pag:st==='entregue'?pick(['Numerário','Multibanco','MB WAY']):null,seedOnly:true});
  });
  DB.orders.sort((a,b)=>b.data-a.data);
})();
function addOrder(o){
  const id='BBD-'+(DB.seq++);
  const ord={id,...o,hist:[{t:'Encomenda feita na loja',d:o.data}]};
  if(o.estado==='pronta'||o.estado==='entregue')ord.hist.push({t:'Marcada como pronta para levantamento',d:new Date(o.data.getTime()+864e5)});
  if(o.estado==='entregue')ord.hist.push({t:`Paga (${o.pag}) e entregue`,d:new Date(o.data.getTime()+2*864e5)});
  if(o.estado==='cancelada')ord.hist.push({t:'Cancelada — stock reposto',d:new Date(o.data.getTime()+864e5)});
  if(o.estado==='expirada')ord.hist.push({t:'Reserva expirada — stock reposto automaticamente',d:new Date(o.data.getTime()+7*864e5)});
  delete ord.seedOnly;DB.orders.push(ord);return ord;
}

let modalStack=[];
function modal({title,sub='',icon='info',iconCls='',size='',body='',foot=[],onOpen,left}){
  const ov=document.createElement('div');ov.className='overlay';
  ov.innerHTML=`<div class="modal ${size}" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <div class="m-head"><div class="mi ${iconCls}">${ic(icon,'width:22px;height:22px')}</div><div><h3>${title}</h3>${sub?`<p>${sub}</p>`:''}</div><button class="x" data-x aria-label="Fechar">${ic('x')}</button></div>
    <div class="m-body">${body}</div>
    ${foot.length||left?`<div class="m-foot">${left?`<div class="left">${left}</div>`:''}${foot.map((b,k)=>`<button class="btn ${b.cls||'btn-line'}" data-f="${k}" ${b.id?`id="${b.id}"`:''}>${b.label}</button>`).join('')}</div>`:''}
  </div>`;
  document.body.appendChild(ov);modalStack.push(ov);
  const close=()=>{ov.classList.remove('on');setTimeout(()=>ov.remove(),250);modalStack=modalStack.filter(m=>m!==ov);};
  ov.addEventListener('mousedown',e=>{if(e.target===ov)close();});
  ov.querySelector('[data-x]').onclick=close;
  foot.forEach((b,k)=>ov.querySelector(`[data-f="${k}"]`).onclick=()=>{if(b.onClick){if(b.onClick(ov,close)!==false&&!b.keep)close();}else close();});
  requestAnimationFrame(()=>ov.classList.add('on'));
  if(onOpen)onOpen(ov,close);
  setTimeout(()=>{const f=ov.querySelector('input:not([type=checkbox]),select,textarea');if(f)f.focus();},80);
  return {el:ov,close};
}
function confirmBox({title,msg,ok='Confirmar',danger=false,icon,onYes}){
  modal({title,icon:icon||(danger?'alert':'info'),iconCls:danger?'red':'',body:`<p>${msg}</p>`,foot:[{label:'Cancelar',cls:'btn-ghost'},{label:ok,cls:danger?'btn-red':'btn-navy',onClick:onYes}]});
}

  </div>
  <div class="table-wrap"><table><thead><tr><th>Produto</th><th>Categoria</th><th>Estado</th><th>Preço</th><th>Stock</th><th>Visível na loja</th><th></th></tr></thead><tbody>
  ${L.length?L.map(p=>`<tr>
    <td><div class="prod">${thumb(p,56,true)}<div><b>${esc(p.nome)}</b><small>BBD-2026-${String(p.id*731).padStart(5,'0')}</small>${p.fotos.length?'':`<br><span class="no-photo-tag">${ic('alert','width:12px;height:12px')}Sem fotografia</span>`}</div></div></td>
    <td>${C(p.cat).nome}${C(p.cat).limite?` <span class="pill red" title="Limite por encomenda">máx. ${C(p.cat).limite}</span>`:''}</td>

BIND.products=()=>{
  $('#pq').oninput=e=>{state.prodQ=e.target.value;const pos=e.target.selectionStart;render();const i=$('#pq');i.focus();i.setSelectionRange(pos,pos);};
  $('#pc').onchange=e=>{state.prodCat=e.target.value;render();};
  bindStock();
  $$('[data-tg]').forEach(b=>b.onclick=()=>{const p=P(+b.dataset.tg);p.ativo=!p.ativo;b.classList.toggle('on',p.ativo);toast(p.ativo?`“${p.nome}” visível na loja`:`“${p.nome}” escondido da loja`);});
  $$('[data-ed]').forEach(b=>b.onclick=()=>editProduct(+b.dataset.ed));
  $$('[data-dl]').forEach(b=>b.onclick=()=>{const p=P(+b.dataset.dl);confirmBox({title:'Apagar produto?',danger:true,ok:'Apagar',msg:`Vais apagar <b>${esc(p.nome)}</b>. Esta ação não pode ser anulada. As encomendas antigas mantêm o histórico.`,onYes:()=>{DB.products=DB.products.filter(x=>x!==p);refresh();toast('Produto apagado');}});});
  $('#expProd').onclick=()=>csv('produtos.csv',[['Produto','Categoria','Estado','Preço','Stock','Stock inicial','Visível'],...DB.products.map(p=>[p.nome,C(p.cat).nome,p.estado,p.preco,p.stock,p.ini,p.ativo?'Sim':'Não'])]);
};
function bindStock(){
  const adj=(id,d)=>{const p=P(id);if(p.stock+d<0)return;p.stock+=d;if(d>0&&p.stock>p.ini)p.ini=p.stock;move(id,d,'Ajuste manual','');render();
    if(d<0&&p.stock<=DB.settings.lowStock&&p.stock>0)mailToast('stock',DB.settings.alertEmail);};
  $$('[data-su]').forEach(b=>b.onclick=()=>adj(+b.dataset.su,1));
  $$('[data-sd]').forEach(b=>b.onclick=()=>adj(+b.dataset.sd,-1));
}
function editProduct(id){
  const p=id?P(id):{nome:'',cat:1,icone:'cadeira',preco:'',estado:'Como novo',peso:'',stock:1,ini:1,ativo:true,novo:true,desc:''};
  const isNew=!id;let icon=p.icone;let fotos=[...(p.fotos||[])];
  modal({title:isNew?'Novo produto':'Editar produto',sub:isNew?'Doação Fidelidade · aparece na montra da loja':`Código BBD-2026-${String(id*731).padStart(5,'0')}`,icon:'box',size:'lg',
    body:`<div class="form">
      <div class="cols"><div class="f"><label>Nome do produto</label><input name="nome" value="${esc(p.nome)}" placeholder="Ex.: Cadeira de escritório"></div>
      <div class="f"><label>Categoria</label><select name="cat">${DB.cats.map(c=>`<option value="${c.id}" ${c.id==p.cat?'selected':''}>${c.nome}${c.limite?` (máx. ${c.limite}/encomenda)`:''}</option>`).join('')}</select></div></div>
      <div class="cols3"><div class="f"><label>Preço solidário</label><div class="input-suffix"><input name="preco" type="number" min="0" step="0.5" value="${p.preco}"><span>€</span></div></div>
      <div class="f"><label>Estado</label><select name="estado">${['Novo','Como novo','Bom'].map(s=>`<option ${s===p.estado?'selected':''}>${s}</option>`).join('')}</select></div>
      <div class="f"><label>Peso <small>(para o impacto)</small></label><div class="input-suffix"><input name="peso" type="number" min="0" step="0.1" value="${p.peso}"><span>kg</span></div></div></div>
      <div class="cols"><div class="f"><label>Stock disponível</label><input name="stock" type="number" min="0" step="1" value="${p.stock}"><div class="hint">Desce sozinho a cada encomenda e volta ao cancelar/expirar.</div></div>
      <div class="f"><span class="l">Código</span><input value="${isNew?'Gerado ao criar':'BBD-2026-'+String(id*731).padStart(5,'0')}" disabled style="background:var(--paper-2)"></div></div>
      <div class="f"><span class="l">Fotografias <small>· até ${MAXF} · JPG, PNG ou WebP até 5 MB · a primeira é a capa na loja</small></span><div class="gallery" id="gal"></div><div id="galNote"></div></div>
      <div class="f"><label>Descrição <small>(opcional)</small></label><textarea name="desc" rows="3" style="min-height:80px" placeholder="Detalhes, medidas, marcas de uso…">${esc(p.desc||'')}</textarea></div>
      <div class="cols"><div class="switch-row"><div><b>Visível na loja</b><span>Os colaboradores podem ver e comprar</span></div><button type="button" class="toggle ${p.ativo?'on':''}" data-t="ativo"></button></div>
      <div class="switch-row"><div><b>Selo “Chegou hoje”</b><span>Destaque na montra</span></div><button type="button" class="toggle ${p.novo?'on':''}" data-t="novo"></button></div></div>
    </div>`,
    left:isNew?'':`<button class="btn btn-danger" id="delInModal">${ic('trash')}Apagar</button>`,
    foot:[{label:'Cancelar',cls:'btn-ghost'},{label:isNew?'Criar produto':'Guardar alterações',cls:'btn-red',onClick:(ov)=>{
      clearErr(ov);const g=n=>ov.querySelector(`[name="${n}"]`).value;let ok=true;
      if(!g('nome').trim())ok=fieldErr(ov,'nome','Indica o nome do produto.');
      if(g('preco')===''||+g('preco')<0)ok=fieldErr(ov,'preco','Preço inválido.');
      if(g('stock')===''||+g('stock')<0||!Number.isInteger(+g('stock')))ok=fieldErr(ov,'stock','Stock tem de ser um número inteiro ≥ 0.');
      if(!ok)return false;
      if(!fotos.length&&ov.querySelector('[data-t=ativo]').classList.contains('on')&&!ov.dataset.warned){ov.dataset.warned=1;ov.querySelector('#galNote').innerHTML=`<div class="note amber" style="margin-top:10px">${ic('alert')}<div><b>Este produto não tem fotografias.</b> Vai aparecer na loja sem foto. Clica de novo em guardar para continuar.</div></div>`;ov.querySelector('#gal').scrollIntoView({behavior:'smooth',block:'center'});return false;}
      const data={fotos:[...fotos],nome:g('nome').trim(),cat:+g('cat'),preco:+g('preco'),estado:g('estado'),peso:+g('peso')||0,icone:icon,desc:g('desc'),ativo:ov.querySelector('[data-t=ativo]').classList.contains('on'),novo:ov.querySelector('[data-t=novo]').classList.contains('on')};
      const st=+g('stock');
      if(isNew){const np={id:Math.max(0,...DB.products.map(x=>x.id))+1,...data,stock:st,ini:st};DB.products.unshift(np);move(np.id,st,'Entrada de stock (nova doação)','');toast('Produto criado','ok',`${data.nome} · ${st} un.`);}
      else{const d=st-p.stock;Object.assign(p,data);if(d){p.stock=st;if(st>p.ini)p.ini=st;move(p.id,d,'Ajuste manual','');}toast('Alterações guardadas');}
      refresh();
    }}],
    onOpen:(ov,close)=>{
      const gal=ov.querySelector('#gal');
      const drawGal=()=>{
        gal.innerHTML=fotos.map((f,k)=>`<div class="ph-card ${k===0?'cover':''}">${k===0?'<span class="cv">Capa</span>':''}<img src="${f}" alt="Fotografia ${k+1}" data-view="${k}"><div class="tools">
          <button type="button" data-mv="${k}" data-d="-1" ${k===0?'disabled':''} title="Mover para a esquerda">${ic('chev','width:15px;height:15px')}</button>
          ${k?`<button type="button" data-cover="${k}" title="Tornar capa">★</button>`:''}
          <button type="button" data-mv="${k}" data-d="1" ${k===fotos.length-1?'disabled':''} title="Mover para a direita" style="transform:scaleX(-1)">${ic('chev','width:15px;height:15px')}</button>
          <button type="button" class="del" data-rmf="${k}" title="Remover">${ic('trash','width:15px;height:15px')}</button></div></div>`).join('')
          +(fotos.length<MAXF?`<label class="drop" id="drop">${ic('plus','width:26px;height:26px')}<span><b>Adicionar fotos</b>arrasta para aqui ou clica</span><input type="file" accept="image/jpeg,image/png,image/webp" multiple hidden id="fIn"></label>`:'');
        gal.querySelectorAll('[data-mv]').forEach(b=>b.onclick=()=>{const k=+b.dataset.mv,d=+b.dataset.d;[fotos[k],fotos[k+d]]=[fotos[k+d],fotos[k]];drawGal();});
        gal.querySelectorAll('[data-cover]').forEach(b=>b.onclick=()=>{const k=+b.dataset.cover;fotos.unshift(fotos.splice(k,1)[0]);drawGal();toast('Nova capa definida');});
        gal.querySelectorAll('[data-rmf]').forEach(b=>b.onclick=()=>{fotos.splice(+b.dataset.rmf,1);drawGal();});
        gal.querySelectorAll('[data-view]').forEach(im=>im.onclick=()=>lightbox(fotos,+im.dataset.view,g('nome')||'Novo produto'));
        const dr=gal.querySelector('#drop');
        if(dr){const fin=gal.querySelector('#fIn');fin.onchange=()=>addFiles(fin.files);
          dr.ondragover=e=>{e.preventDefault();dr.classList.add('over');};dr.ondragleave=()=>dr.classList.remove('over');
          dr.ondrop=e=>{e.preventDefault();dr.classList.remove('over');addFiles(e.dataTransfer.files);};}
      };
      const g=n=>ov.querySelector(`[name="${n}"]`).value;
      const addFiles=files=>{
        const L=[...files];let skipped=0;
        L.forEach(f=>{
          if(!/^image\/(jpeg|png|webp)$/.test(f.type)){toast(`${f.name}: formato não suportado`,'err');return;}
          if(f.size>5*1024*1024){toast(`${f.name}: maior que 5 MB`,'err');return;}
          if(fotos.length>=MAXF){skipped++;return;}
          fotos.push(null);const idx=fotos.length-1;
          const r=new FileReader();r.onload=()=>{fotos[idx]=r.result;drawGal();ov.querySelector('#galNote').innerHTML='';};r.readAsDataURL(f);
        });
        if(skipped)toast(`Máximo de ${MAXF} fotografias por produto`,'err');
      };
      drawGal();
      ov.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>b.classList.toggle('on'));
      const d=ov.querySelector('#delInModal');if(d)d.onclick=()=>{close();$$('[data-dl]').length?null:null;confirmBox({title:'Apagar produto?',danger:true,ok:'Apagar',msg:`Vais apagar <b>${esc(p.nome)}</b>.`,onYes:()=>{DB.products=DB.products.filter(x=>x!==p);refresh();toast('Produto apagado');}});};
    }});
}

BIND.orders=()=>{

};
function openOrder(id){
  const o=DB.orders.find(x=>x.id===id);if(!o)return;
  const act=['pendente','pronta'].includes(o.estado),dl=daysLeft(o);
  const steps=[['Reservada','Encomenda feita na loja'],['Pronta p/ levantar','Colaborador avisado por email'],['Paga e entregue','Pagamento presencial']];
  const idx={pendente:0,pronta:1,entregue:2}[o.estado];
  const m=modal({title:`Encomenda ${o.id}`,sub:fmtDT(o.data)+' · '+({pendente:'Reservada',pronta:'Pronta para levantamento',entregue:'Paga e entregue',cancelada:'Cancelada',expirada:'Expirada'}[o.estado]),icon:'cart',iconCls:o.estado==='entregue'?'green':['cancelada','expirada'].includes(o.estado)?'red':'',size:'lg',
    body:`<div class="od-grid"><div>
      ${act?`<div class="note ${dl<=2?'amber':''}" style="margin-bottom:14px">${ic('clock')}<div>Reservada até <b>${deadline(o).toLocaleDateString('pt-PT')}</b> (${dl<=0?'expira hoje':`faltam ${dl} dia(s)`}). Se não for levantada, é cancelada automaticamente e o stock volta à loja.</div></div>`:''}
      <div class="info-box"><h4>Artigos</h4><div class="items-list">${o.items.map(i=>{const p=P(i.pid);return `<div class="it">${thumb(p,48,true)}<div class="t"><b>${p?esc(p.nome):'Produto removido'}</b><small>${i.q} × ${eur(i.preco)}${p&&C(p.cat).limite?` · ${C(p.cat).nome} (máx. ${C(p.cat).limite})`:''}</small></div><b class="num">${eur(i.q*i.preco)}</b></div>`;}).join('')}</div>
        <div class="kv" style="border-top:2px solid var(--ink);margin-top:6px;padding-top:12px;font-size:16px"><b>Total a pagar no levantamento</b><b class="num">${eur(total(o))}</b></div></div>
    </div><div style="display:grid;gap:14px;align-content:start">

function payModal(o){

/* simular encomenda (mostra a gestão automática de stock) */
$('#simBtn').onclick=()=>{
  const avail=DB.products.filter(p=>p.ativo&&p.stock>0);if(!avail.length)return toast('Sem produtos com stock','err');
  const p=pick(avail),lim=C(p.cat).limite,q=Math.min(p.stock,lim||2,1+Math.floor(rnd()*2));
  const [nome,mail]=pick(PEOPLE);
  const o=addOrder({nome,email:mail+'@fidelidade.pt',ncol:String(10000+Math.floor(rnd()*9000)),tel:'',items:[{pid:p.id,q,preco:p.preco}],estado:'pendente',data:new Date()});
  DB.orders.sort((a,b)=>b.data-a.data);
  p.stock-=q;move(p.id,-q,'Encomenda na loja',o.id);DB.moves[0].user='Sistema';
  refresh();toast(`Nova encomenda ${o.id}`,'ok',`${q}× ${p.nome} · stock ${p.stock+q} → ${p.stock}`);
  setTimeout(()=>mailToast('conf',o.email),600);
  if(p.stock<=DB.settings.lowStock)setTimeout(()=>mailToast('stock',DB.settings.alertEmail),1200);
};

/* ---------- RELATÓRIOS ---------- */
VIEWS.reports=()=>{
  const from=daysAgo(state.repDays);
  const O=DB.orders.filter(o=>o.data>=from&&!['cancelada','expirada'].includes(o.estado));
  const byCat=DB.cats.map(c=>({c,v:O.reduce((s,o)=>s+o.items.filter(i=>P(i.pid)&&P(i.pid).cat===c.id).reduce((a,i)=>a+i.q*i.preco,0),0)}));
  const mx=Math.max(...byCat.map(x=>x.v),1);
  const byP={};O.forEach(o=>o.items.forEach(i=>{byP[i.pid]=byP[i.pid]||{q:0,v:0};byP[i.pid].q+=i.q;byP[i.pid].v+=i.q*i.preco;}));
  const top=Object.entries(byP).sort((a,b)=>b[1].v-a[1].v).slice(0,6);
  const tot=O.reduce((s,o)=>s+total(o),0),paid=O.filter(o=>o.estado==='entregue').reduce((s,o)=>s+total(o),0);
  const canc=DB.orders.filter(o=>o.data>=from&&['cancelada','expirada'].includes(o.estado)).length;
  return `
  <div class="page-head"><div><h1>Relatórios</h1><p>Vendas, stock e impacto da campanha.</p></div>
  <div class="actions"><div class="seg">${[[7,'7 dias'],[30,'30 dias'],[90,'90 dias']].map(([d,l])=>`<button class="${state.repDays===d?'on':''}" data-rd="${d}">${l}</button>`).join('')}</div><button class="btn btn-line" id="expRep">${ic('down')}CSV</button></div></div>
  <div class="grid kpis">
    <div class="card kpi k1"><div class="ic">${ic('cart')}</div><div class="lbl">Valor encomendado</div><div class="val">${eur(tot)}</div><div class="sub">${O.length} encomendas</div></div>
    <div class="card kpi k3"><div class="ic">${ic('euro')}</div><div class="lbl">Recebido</div><div class="val">${eur(paid)}</div><div class="sub">pago presencialmente</div></div>
    <div class="card kpi k2"><div class="ic">${ic('clock')}</div><div class="lbl">Por receber</div><div class="val">${eur(tot-paid)}</div><div class="sub">reservadas / prontas</div></div>
    <div class="card kpi k4"><div class="ic">${ic('x')}</div><div class="lbl">Canceladas / expiradas</div><div class="val">${canc}</div><div class="sub">stock reposto automaticamente</div></div>
  </div>
  <div class="grid two" style="margin-top:18px">
    <div class="card"><div class="card-head"><div><h3>Vendas por categoria</h3><p>Últimos ${state.repDays} dias</p></div></div>
      ${byCat.map(x=>`<div class="hbar"><span>${x.c.nome}</span><div class="t"><i style="width:0" data-w="${x.v/mx*100}"></i></div><b>${eur(x.v)}</b></div>`).join('')}</div>
    <div class="card"><div class="card-head"><div><h3>Mais vendidos</h3><p>Por valor</p></div></div>
      ${top.length?top.map(([pid,v],k)=>{const p=P(+pid);return `<div class="alert-item"><div class="ai" style="background:var(--paper-2);font-weight:700;color:var(--navy)">${k+1}</div><div class="tx"><b>${p?esc(p.nome):'—'}</b><span>${v.q} un.</span></div><b class="num">${eur(v.v)}</b></div>`;}).join(''):'<div class="empty">Sem vendas no período.</div>'}</div>
  </div>
  <div class="card" style="margin-top:18px;padding:0"><div class="card-head" style="padding:20px 22px 0"><div><h3>Stock atual vs. doado</h3><p>Quanto de cada doação já ganhou uma segunda vida</p></div></div>
  <div style="overflow:auto"><table><thead><tr><th>Produto</th><th>Doado</th><th>Em stock</th><th>Saíram</th><th>Escoamento</th></tr></thead><tbody>
  ${DB.products.map(p=>{const out=Math.max(0,p.ini-p.stock),pc=Math.round(out/Math.max(p.ini,1)*100);return `<tr><td><div class="prod">${thumb(p,36)}<b>${esc(p.nome)}</b></div></td><td>${p.ini}</td><td class="num" style="color:${p.stock===0?'var(--red)':''}">${p.stock}</td><td>${out}</td><td><div class="hbar" style="grid-template-columns:1fr 44px;margin:0"><div class="t"><i style="width:${pc}%;background:${pc>=100?'var(--red)':'var(--navy)'}"></i></div><b>${pc}%</b></div></td></tr>`;}).join('')}
  </tbody></table></div></div>`;
};
BIND.reports=()=>{
  $$('[data-rd]').forEach(b=>b.onclick=()=>{state.repDays=+b.dataset.rd;render();});

    body:`<div class="form"><div class="f"><label>Nova palavra-passe</label><div class="input-suffix"><input name="p1" type="password" autocomplete="new-password"><button type="button" data-eye>Mostrar</button></div><div class="meter"><i id="pm"></i></div><div class="hint" id="pmh">Mínimo 8 caracteres.</div></div>

      <div class="switch-row"><div><b>Terminar sessões abertas</b><span>Quem já entrou tem de introduzir a nova palavra-passe</span></div><button type="button" class="toggle on" id="sessT"></button></div></div>`,
    foot:[{label:'Cancelar',cls:'btn-ghost'},{label:'Guardar palavra-passe',cls:'btn-red',onClick:ov=>{clearErr(ov);const a=ov.querySelector('[name=p1]').value,b=ov.querySelector('[name=p2]').value;
      if(a.length<8)return fieldErr(ov,'p1','Tem de ter pelo menos 8 caracteres.');if(a!==b)return fieldErr(ov,'p2','As palavras-passe não coincidem.');
      DB.settings.pwChanged=new Date(today);render();toast('Palavra-passe da loja alterada',ov.querySelector('#sessT').classList.contains('on')?'ok':'ok',ov.querySelector('#sessT').classList.contains('on')?'Sessões abertas terminadas':'');}}],
    onOpen:ov=>{const i=ov.querySelector('[name=p1]');i.oninput=()=>{const v=i.value;let sc=(v.length>=8)+(v.length>=12)+/[A-Z]/.test(v)+/\d/.test(v)+/[^\w]/.test(v);const m=ov.querySelector('#pm');m.style.width=sc*20+'%';m.style.background=sc<=2?'var(--red)':sc<=3?'var(--amber)':'var(--green)';ov.querySelector('#pmh').textContent=v.length<8?'Mínimo 8 caracteres.':['','Fraca','Fraca','Razoável','Forte','Muito forte'][sc];};
      ov.querySelector('[data-eye]').onclick=e=>{ov.querySelectorAll('[name=p1],[name=p2]').forEach(x=>x.type=x.type==='password'?'text':'password');e.target.textContent=i.type==='password'?'Mostrar':'Esconder';};
      ov.querySelector('#sessT').onclick=e=>e.currentTarget.classList.toggle('on');}});
  $('#stBtn').onclick=()=>{const s=DB.settings;modal({title:'Gestão automática de stock',icon:'refresh',iconCls:'green',
    body:`<div class="form"><div class="cols"><div class="f"><label>Dias de reserva</label><div class="input-suffix"><input name="rd" type="number" min="1" value="${s.reserveDays}"><span>dias</span></div><div class="hint">Tempo para levantar e pagar.</div></div>
      <div class="f"><label>Alerta de stock baixo</label><div class="input-suffix"><input name="ls" type="number" min="0" value="${s.lowStock}"><span>un.</span></div></div></div>
      <div class="f"><label>Enviar alertas para</label><input name="ae" type="email" value="${esc(s.alertEmail)}"></div>
      <div class="switch-row"><div><b>Cancelar reservas expiradas automaticamente</b><span>O stock volta à loja e o colaborador é avisado</span></div><button type="button" class="toggle ${s.autoExpire?'on':''}" id="aeT"></button></div>
      <div class="switch-row"><div><b>Descontar stock ao encomendar</b><span>Sempre ativo — evita vender o que não existe</span></div><button type="button" class="toggle on" disabled></button></div>
      <div class="switch-row"><div><b>Repor stock ao cancelar</b><span>Sempre ativo</span></div><button type="button" class="toggle on" disabled></button></div></div>`,
    foot:[{label:'Cancelar',cls:'btn-ghost'},{label:'Guardar',cls:'btn-red',onClick:ov=>{clearErr(ov);const rd=+ov.querySelector('[name=rd]').value,ls=+ov.querySelector('[name=ls]').value,ae=ov.querySelector('[name=ae]').value;
      if(!(rd>=1))return fieldErr(ov,'rd','Mínimo 1 dia.');if(!(ls>=0))return fieldErr(ov,'ls','Valor inválido.');if(!/^\S+@\S+\.\S+$/.test(ae))return fieldErr(ov,'ae','Email inválido.');
      Object.assign(s,{reserveDays:rd,lowStock:ls,alertEmail:ae,autoExpire:ov.querySelector('#aeT').classList.contains('on')});refresh();toast('Definições de stock guardadas');}}],
    onOpen:ov=>{ov.querySelector('#aeT').onclick=e=>e.currentTarget.classList.toggle('on');}});};
  $('#pkBtn').onclick=()=>{const s=DB.settings;modal({title:'Levantamento e pagamento',icon:'pin',
    body:`<div class="form"><div class="f"><label>Local de levantamento</label><input name="pp" value="${esc(s.pickupPlace)}"><div class="hint">Aparece nos emails ({{local_levantamento}}).</div></div>
      <div class="f"><label>Horário</label><input name="ph" value="${esc(s.pickupHours)}"></div>
      <div class="note">${ic('euro')}<div>A loja não tem pagamento online: o colaborador encomenda no site e paga presencialmente no levantamento.</div></div></div>`,
    foot:[{label:'Cancelar',cls:'btn-ghost'},{label:'Guardar',cls:'btn-red',onClick:ov=>{clearErr(ov);const pp=ov.querySelector('[name=pp]').value.trim();if(!pp)return fieldErr(ov,'pp','Obrigatório.');s.pickupPlace=pp;s.pickupHours=ov.querySelector('[name=ph]').value.trim();render();toast('Guardado');}}]});};
};

/* ---------- LIGHTBOX ---------- */
function lightbox(list,start=0,title=''){
  list=list.filter(Boolean);if(!list.length)return;let k=start;
  const el=document.createElement('div');el.className='lb';
  const draw=()=>{el.innerHTML=`<div class="lb-top"><div><b>${esc(title)}</b><span>${k+1} / ${list.length}</span></div><button data-c aria-label="Fechar">${ic('x')}</button></div>
    <div class="lb-main">${list.length>1?`<button class="lb-nav p" data-p aria-label="Anterior">${ic('chev')}</button>`:''}<img src="${list[k]}" alt="">${list.length>1?`<button class="lb-nav n" data-n aria-label="Seguinte" style="transform:translateY(-50%) scaleX(-1)">${ic('chev')}</button>`:''}</div>
    <div class="lb-strip">${list.length>1?list.map((f,i)=>`<img src="${f}" data-i="${i}" class="${i===k?'on':''}">`).join(''):''}</div>`;
    el.querySelector('[data-c]').onclick=close;
    const p=el.querySelector('[data-p]'),n=el.querySelector('[data-n]');if(p)p.onclick=()=>{k=(k-1+list.length)%list.length;draw();};if(n)n.onclick=()=>{k=(k+1)%list.length;draw();};
    el.querySelectorAll('[data-i]').forEach(i=>i.onclick=()=>{k=+i.dataset.i;draw();});};
  const key=e=>{if(e.key==='Escape'){e.stopImmediatePropagation();close();}if(e.key==='ArrowRight'){k=(k+1)%list.length;draw();}if(e.key==='ArrowLeft'){k=(k-1+list.length)%list.length;draw();}};
  function close(){el.classList.remove('on');document.removeEventListener('keydown',key,true);setTimeout(()=>el.remove(),250);}
  el.onclick=e=>{if(e.target===el||e.target.classList.contains('lb-main'))close();};
  draw();document.body.appendChild(el);document.addEventListener('keydown',key,true);requestAnimationFrame(()=>el.classList.add('on'));
}
document.addEventListener('click',e=>{const t=e.target.closest('[data-lb]');if(!t)return;e.stopPropagation();const p=P(+t.dataset.lb);if(p)lightbox(p.fotos,0,p.nome);},true);

/* ---------- CSV ---------- */
function csv(name,rows){
  const txt='﻿'+rows.map(r=>r.map(c=>`"${String(c??'').replace(/"/g,'""')}"`).join(';')).join('\n');
  try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'text/csv;charset=utf-8'}));a.download=name;document.body.appendChild(a);a.click();a.remove();toast('Ficheiro exportado','ok',name);}catch(e){toast('Não foi possível exportar aqui','err');}
}

/* arranque */
renderNav();render();
</script>
